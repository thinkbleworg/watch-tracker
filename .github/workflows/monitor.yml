name: HMT Watch Tracker (manual / debug only)
#
# The scheduled trigger has been removed on purpose. The
# tracker now runs from a systemd timer on an Oracle Cloud
# VM every 5 minutes (see deploy/oracle-cloud/). Re-enabling
# a `schedule:` block here WILL cause duplicate Telegram
# alerts and two independent, diverging snapshot.json
# copies (this repo's committed one vs. the VM's local
# one) -- don't turn this back on unless the VM deployment
# is torn down first.
#
# Kept as workflow_dispatch only, for manually running the
# tracker from the GitHub UI when debugging.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  monitor:

    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tracker
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python main.py

      - name: Check for Changes
        id: changes
        run: |
          git diff --quiet snapshots/snapshot.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit Snapshot
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add snapshots/snapshot.json
          git commit -m "Update snapshot (manual run)"
          git pull --rebase
          git push
