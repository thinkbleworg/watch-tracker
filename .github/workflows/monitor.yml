name: HMT Watch Tracker

on:

  workflow_dispatch:

  schedule:
    # GitHub does not reliably honor schedules more
    # frequent than ~10-15 minutes on hosted runners --
    # they get delayed or silently dropped under load.
    # For true 5-minute cadence, run this off a VPS or
    # a managed scheduler instead (see README).
    - cron: "*/10 * * * *"

concurrency:
  group: hmt-watch-tracker
  cancel-in-progress: false

permissions:
  contents: write

jobs:

  monitor:

    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Snapshot
        run: |
          ls -R
          echo "-----"
          if [ -f snapshots/snapshot.json ]; then
            echo "Snapshot exists"
            wc -c snapshots/snapshot.json
          else
            echo "Snapshot missing"
          fi

      - name: Run Tracker
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python main.py

      - name: Check for Changes
        id: changes
        run: |
          git diff --quiet snapshots/snapshot.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit Snapshot
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add snapshots/snapshot.json

          git commit -m "Update snapshot" || echo "Nothing to commit"

          git pull --rebase
          git push
